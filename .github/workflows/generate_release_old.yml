name: Generate release for youtube-local
run-name: ${{ github.actor }} is creating release for youtube-local
on:
  push:
    tags:
      # - "*"
      - "do not run"

jobs:
  generate-release-64:
    # if: false
    runs-on: ubuntu-latest
    steps:
      - name: Getting ubuntu version
        id: get-ubuntu-version
        run: |
          echo "DIST_CODENAME=$(lsb_release -c | awk '{print $2}')" >> "$GITHUB_ENV"
      - name: Preparing packages
        id: packages-preparation
        run: |
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          wget -O - https://dl.winehq.org/wine-builds/winehq.key | sudo dd of=/etc/apt/keyrings/winehq-archive.key
          wget -O - https://dl.winehq.org/wine-builds/ubuntu/dists/"$DIST_CODENAME"/winehq-"$DIST_CODENAME".sources | sudo dd of=/etc/apt/sources.list.d/winehq-"$DIST_CODENAME".sources
          sudo apt update
          sudo apt install -y winehq-stable p7zip p7zip-full
          echo "Wine and 7zip is installed"
      - name: Preparing repository
        id: repository-preparation
        uses: actions/checkout@v4
      - name: Setting up latest python
        id: python-setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Setting up wine prefix
        id: setting-up-wine-prefix
        run: |
          echo "WINEPREFIX=$HOME/.wine64" > "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generating release (64 bit)
        id: generating-release-64
        run: |
          cd ${{ github.workspace }}
          python ./generate_release.py 3.13.2
          mkdir -p /tmp/output
          cp -v v*zip /tmp/output/
      - name: Runtime test (64 bit)
        id: runtime-test-64
        run: |
          cd ${{ github.workspace }}/innertube-client1
          wine ../python/python.exe -c "import server; from youtube import util; url = 'https://cloudflare.com/cdn-cgi/trace'; resp = util.fetch_url(url, report_text='Fetching CF trace report') ; print(resp.decode())"
      - name: Uploading build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zip-package-64
          path: /tmp/output/
      - name: Creating youtube-local release (64 bit)
        id: create-release-64
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            TAG="$(git describe --tag)"
            gh release create "$TAG" /tmp/output/* --verify-tag --generate-notes || gh release upload "$TAG" /tmp/output/*

  generate-release-32:
    # if: false
    runs-on: ubuntu-latest
    steps:
      - name: Getting ubuntu version
        id: get-ubuntu-version
        run: |
          echo "DIST_CODENAME=$(lsb_release -c | awk '{print $2}')" >> "$GITHUB_ENV"
      - name: Preparing packages
        id: packages-preparation
        run: |
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          wget -O - https://dl.winehq.org/wine-builds/winehq.key | sudo dd of=/etc/apt/keyrings/winehq-archive.key
          wget -O - https://dl.winehq.org/wine-builds/ubuntu/dists/"$DIST_CODENAME"/winehq-"$DIST_CODENAME".sources | sudo dd of=/etc/apt/sources.list.d/winehq-"$DIST_CODENAME".sources
          sudo apt update
          sudo apt install -y winehq-devel p7zip p7zip-full
          echo "Wine and 7zip is installed"
      - name: Preparing repository
        id: repository-preparation
        uses: actions/checkout@v4
      - name: Setting up latest python
        id: python-setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Setting up wine prefix
        id: setting-up-wine-prefix
        run: |
          echo "WINEPREFIX=$HOME/.wine64" > "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generating release (32 bit)
        id: generating-release-32
        run: |
          cd ${{ github.workspace }}
          python ./generate_release.py 3.8.10 32
          mkdir -p /tmp/output
          cp -v v*zip /tmp/output/
      - name: Runtime test (32 bit)
        id: runtime-test-32
        run: |
          cd ${{ github.workspace }}/innertube-client1
          wine ../python/python.exe -c "import server; from youtube import util; url = 'https://cloudflare.com/cdn-cgi/trace'; resp = util.fetch_url(url, report_text='Fetching CF trace report') ; print(resp.decode())"
      - name: Uploading build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zip-package-32
          path: /tmp/output/
      - name: Creating youtube-local release (32 bit)
        id: create-release-32
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            TAG="$(git describe --tag)"
            gh release create "$TAG" /tmp/output/* --verify-tag --generate-notes || gh release upload "$TAG" /tmp/output/*
